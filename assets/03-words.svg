<svg xmlns="http://www.w3.org/2000/svg" width="780" height="290" viewBox="0 0 780 290">
  <rect x="1" y="1" width="778" height="288" fill="#EBE5DC" stroke="#645d3b" stroke-width="1.5"/>
  <rect x="12" y="12" width="756" height="266" fill="none" stroke="#c9bca4" stroke-width="0.8"/>
  <g font-family="Georgia, 'Times New Roman', Batang, 'Nanum Myeongjo', serif">
    <!-- section heading -->
    <text x="390" y="62" text-anchor="middle" font-size="18" fill="#31331f">&#8545;&#160;&#160;·&#160;&#160;I like the words <tspan font-style="italic" font-weight="bold" fill="#455763">&#8220;Behavio(u)r / Action&#8221;</tspan> and <tspan font-style="italic" font-weight="bold" fill="#455763">&#8220;Adversarial Search&#8221;</tspan></text>

    <line x1="330" y1="86" x2="374" y2="86" stroke="#b3a88f" stroke-width="1"/>
    <text x="390" y="90" text-anchor="middle" font-size="9" fill="#645d3b">&#9670;</text>
    <line x1="406" y1="86" x2="450" y2="86" stroke="#b3a88f" stroke-width="1"/>

    <!-- Behaviour / Action -->
    <text x="390" y="126" text-anchor="middle" font-size="15" font-weight="bold" letter-spacing="1" fill="#645d3b">Behavio(u)r / Action</text>
    <text x="390" y="152" text-anchor="middle" font-size="14" font-style="italic" fill="#5c5643">Behavior of living organisms (humans, animals&#8230;)&#160;&#160;<tspan font-style="normal" font-weight="bold" fill="#455763">VS.</tspan>&#160;&#160;Behavior of non-living things (AI, robots&#8230;)</text>

    <!-- Adversarial Search -->
    <text x="390" y="196" text-anchor="middle" font-size="15" font-weight="bold" letter-spacing="1" fill="#645d3b">Adversarial Search</text>
    <text x="390" y="222" text-anchor="middle" font-size="14" font-style="italic" fill="#5c5643">Ever since I was young, I enjoyed learning about things that held completely opposite information.</text>
    <text x="390" y="248" text-anchor="middle" font-size="12.5" font-style="italic" fill="#7a7258">ex)&#160;&#160;Min&#160;&#160;<tspan font-style="normal" font-weight="bold" fill="#455763">VS.</tspan>&#160;&#160;Max</text>
  </g>
</svg>
