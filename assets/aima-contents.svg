<svg xmlns="http://www.w3.org/2000/svg" width="780" height="560" viewBox="0 0 780 560">
  <!-- parchment page with double frame -->
  <rect x="1" y="1" width="778" height="558" fill="#fbf8f0" stroke="#cbbb8e" stroke-width="1.5"/>
  <rect x="12" y="12" width="756" height="536" fill="none" stroke="#dccfa9" stroke-width="0.8"/>

  <g font-family="Georgia, 'Times New Roman', serif">
    <!-- title block -->
    <text x="390" y="78" text-anchor="middle" font-size="26" letter-spacing="5" fill="#2f2a22">ARTIFICIAL INTELLIGENCE</text>
    <text x="390" y="108" text-anchor="middle" font-size="17" font-style="italic" fill="#6d5f45">A Modern Approach</text>
    <text x="390" y="138" text-anchor="middle" font-size="15" fill="#4a4436">Stuart Russell&#160;&#160;·&#160;&#160;Peter Norvig</text>
    <text x="390" y="161" text-anchor="middle" font-size="12" letter-spacing="3" fill="#93835d">THIRD EDITION</text>

    <!-- ornament divider -->
    <line x1="290" y1="181" x2="372" y2="181" stroke="#c4b489" stroke-width="1"/>
    <text x="390" y="185.5" text-anchor="middle" font-size="10" fill="#b3a374">&#9670;</text>
    <line x1="408" y1="181" x2="490" y2="181" stroke="#c4b489" stroke-width="1"/>

    <text x="390" y="216" text-anchor="middle" font-size="13" letter-spacing="7" fill="#93835d">CONTENTS</text>

    <!-- Part I -->
    <text x="100" y="254" font-size="14" letter-spacing="2" fill="#5a5140" font-weight="bold">PART&#160;&#160;&#8544;&#160;&#160;·&#160;&#160;ARTIFICIAL INTELLIGENCE</text>

    <text x="100" y="284" font-size="15" fill="#9b937f">1&#160;&#160;&#160;Introduction</text>
    <line x1="232" y1="279" x2="640" y2="279" stroke="#c2b795" stroke-width="1.4" stroke-dasharray="1 6" stroke-linecap="round"/>
    <text x="688" y="284" text-anchor="end" font-size="15" fill="#9b937f">1</text>

    <text x="100" y="314" font-size="15" fill="#4a4436">2&#160;&#160;&#160;Intelligent Agents</text>
    <line x1="282" y1="309" x2="640" y2="309" stroke="#c2b795" stroke-width="1.4" stroke-dasharray="1 6" stroke-linecap="round"/>
    <text x="688" y="314" text-anchor="end" font-size="15" fill="#4a4436">34</text>

    <!-- highlighted: 2.2 Good Behavior -->
    <rect x="74" y="327" width="634" height="28" rx="4" fill="#f6ecca"/>
    <text x="56" y="347" font-size="15" fill="#b08e33">&#10087;</text>
    <text x="122" y="346" font-size="15" font-weight="bold" fill="#1f4bb8">2.2&#160;&#160;Good Behavior: <tspan font-style="italic">The Concept of Rationality</tspan></text>
    <line x1="505" y1="341" x2="640" y2="341" stroke="#cbb26a" stroke-width="1.4" stroke-dasharray="1 6" stroke-linecap="round"/>
    <text x="688" y="346" text-anchor="end" font-size="15" font-weight="bold" fill="#1f4bb8">36</text>

    <!-- Part II -->
    <text x="100" y="392" font-size="14" letter-spacing="2" fill="#5a5140" font-weight="bold">PART&#160;&#160;&#8545;&#160;&#160;·&#160;&#160;PROBLEM-SOLVING</text>

    <text x="100" y="422" font-size="15" fill="#9b937f">3&#160;&#160;&#160;Solving Problems by Searching</text>
    <line x1="352" y1="417" x2="640" y2="417" stroke="#c2b795" stroke-width="1.4" stroke-dasharray="1 6" stroke-linecap="round"/>
    <text x="688" y="422" text-anchor="end" font-size="15" fill="#9b937f">64</text>

    <text x="100" y="452" font-size="15" fill="#9b937f">4&#160;&#160;&#160;Beyond Classical Search</text>
    <line x1="308" y1="447" x2="640" y2="447" stroke="#c2b795" stroke-width="1.4" stroke-dasharray="1 6" stroke-linecap="round"/>
    <text x="688" y="452" text-anchor="end" font-size="15" fill="#9b937f">120</text>

    <!-- highlighted: 5 Adversarial Search -->
    <rect x="74" y="465" width="634" height="28" rx="4" fill="#f6ecca"/>
    <text x="56" y="485" font-size="15" fill="#b08e33">&#10087;</text>
    <text x="100" y="484" font-size="15" font-weight="bold" fill="#1f4bb8">5&#160;&#160;&#160;<tspan font-style="italic">Adversarial Search</tspan></text>
    <line x1="296" y1="479" x2="640" y2="479" stroke="#cbb26a" stroke-width="1.4" stroke-dasharray="1 6" stroke-linecap="round"/>
    <text x="688" y="484" text-anchor="end" font-size="15" font-weight="bold" fill="#1f4bb8">161</text>

    <!-- footnote -->
    <text x="390" y="526" text-anchor="middle" font-size="12.5" font-style="italic" fill="#7d7156">&#8251; In the Fourth Edition, &#8220;5. Adversarial Search&#8221; was retitled &#8220;6. Adversarial Search and Games.&#8221;</text>
  </g>
</svg>
