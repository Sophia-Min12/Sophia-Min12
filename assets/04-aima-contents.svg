<svg xmlns="http://www.w3.org/2000/svg" width="780" height="590" viewBox="0 0 780 590">
  <!-- parchment page with olive double frame -->
  <rect x="1" y="1" width="778" height="588" fill="#EBE5DC" stroke="#645d3b" stroke-width="1.5"/>
  <rect x="12" y="12" width="756" height="566" fill="none" stroke="#c9bca4" stroke-width="0.8"/>

  <g font-family="Georgia, 'Times New Roman', serif">
    <!-- title block -->
    <text x="390" y="78" text-anchor="middle" font-size="26" letter-spacing="5" fill="#31331f">ARTIFICIAL INTELLIGENCE</text>
    <text x="390" y="108" text-anchor="middle" font-size="17" font-style="italic" fill="#645d3b">A Modern Approach</text>
    <text x="390" y="138" text-anchor="middle" font-size="15" fill="#4f4b38">Stuart Russell&#160;&#160;·&#160;&#160;Peter Norvig</text>
    <text x="390" y="161" text-anchor="middle" font-size="12" letter-spacing="3" fill="#455763">THIRD EDITION</text>

    <!-- ornament divider -->
    <line x1="290" y1="181" x2="372" y2="181" stroke="#b3a88f" stroke-width="1"/>
    <text x="390" y="185.5" text-anchor="middle" font-size="10" fill="#645d3b">&#9670;</text>
    <line x1="408" y1="181" x2="490" y2="181" stroke="#b3a88f" stroke-width="1"/>

    <text x="390" y="216" text-anchor="middle" font-size="13" letter-spacing="7" fill="#7a7258">CONTENTS</text>

    <!-- Part I -->
    <text x="100" y="254" font-size="14" letter-spacing="2" fill="#455763" font-weight="bold">PART&#160;&#160;&#8544;&#160;&#160;·&#160;&#160;ARTIFICIAL INTELLIGENCE</text>

    <text x="100" y="284" font-size="15" fill="#a29a86">1&#160;&#160;&#160;Introduction</text>
    <line x1="232" y1="279" x2="640" y2="279" stroke="#c4bba6" stroke-width="1.4" stroke-dasharray="1 6" stroke-linecap="round"/>
    <text x="688" y="284" text-anchor="end" font-size="15" fill="#a29a86">1</text>

    <text x="100" y="314" font-size="15" fill="#31331f">2&#160;&#160;&#160;Intelligent Agents</text>
    <line x1="282" y1="309" x2="640" y2="309" stroke="#c4bba6" stroke-width="1.4" stroke-dasharray="1 6" stroke-linecap="round"/>
    <text x="688" y="314" text-anchor="end" font-size="15" fill="#31331f">34</text>

    <!-- highlighted: 2.2 Good Behavior -->
    <rect x="74" y="327" width="634" height="28" rx="4" fill="#d8cdbc"/>
    <text x="56" y="347" font-size="15" fill="#645d3b">&#10087;</text>
    <text x="122" y="346" font-size="15" font-weight="bold" fill="#455763">2.2&#160;&#160;Good Behavior: <tspan font-style="italic">The Concept of Rationality</tspan></text>
    <line x1="505" y1="341" x2="640" y2="341" stroke="#a89c82" stroke-width="1.4" stroke-dasharray="1 6" stroke-linecap="round"/>
    <text x="688" y="346" text-anchor="end" font-size="15" font-weight="bold" fill="#455763">36</text>

    <!-- Part II -->
    <text x="100" y="392" font-size="14" letter-spacing="2" fill="#455763" font-weight="bold">PART&#160;&#160;&#8545;&#160;&#160;·&#160;&#160;PROBLEM-SOLVING</text>

    <text x="100" y="422" font-size="15" fill="#a29a86">3&#160;&#160;&#160;Solving Problems by Searching</text>
    <line x1="352" y1="417" x2="640" y2="417" stroke="#c4bba6" stroke-width="1.4" stroke-dasharray="1 6" stroke-linecap="round"/>
    <text x="688" y="422" text-anchor="end" font-size="15" fill="#a29a86">64</text>

    <text x="100" y="452" font-size="15" fill="#a29a86">4&#160;&#160;&#160;Beyond Classical Search</text>
    <line x1="308" y1="447" x2="640" y2="447" stroke="#c4bba6" stroke-width="1.4" stroke-dasharray="1 6" stroke-linecap="round"/>
    <text x="688" y="452" text-anchor="end" font-size="15" fill="#a29a86">120</text>

    <!-- highlighted: 5 Adversarial Search -->
    <rect x="74" y="465" width="634" height="28" rx="4" fill="#d8cdbc"/>
    <text x="56" y="485" font-size="15" fill="#645d3b">&#10087;</text>
    <text x="100" y="484" font-size="15" font-weight="bold" fill="#455763">5&#160;&#160;&#160;<tspan font-style="italic">Adversarial Search</tspan></text>
    <line x1="296" y1="479" x2="640" y2="479" stroke="#a89c82" stroke-width="1.4" stroke-dasharray="1 6" stroke-linecap="round"/>
    <text x="688" y="484" text-anchor="end" font-size="15" font-weight="bold" fill="#455763">161</text>

    <!-- edition footnote -->
    <text x="390" y="524" text-anchor="middle" font-size="12.5" font-style="italic" fill="#6e6754">&#8224; In the Fourth Edition, &#8220;5. Adversarial Search&#8221; was retitled &#8220;6. Adversarial Search and Games.&#8221;</text>

    <!-- personal note -->
    <text x="390" y="552" text-anchor="middle" font-size="12.5" font-style="italic" fill="#455763">&#8251; Note &#8212; Actually, I really like the overall content of this book.</text>
  </g>
</svg>
