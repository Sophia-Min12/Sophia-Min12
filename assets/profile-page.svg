<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1640" viewBox="0 0 800 1640">
  <!-- one continuous parchment page: Sand ground, Moss + Wood double frame -->
  <rect x="1" y="1" width="798" height="1638" fill="#E8E2DA" stroke="#31331f" stroke-width="1.5"/>
  <rect x="14" y="14" width="772" height="1612" fill="none" stroke="#b9ad94" stroke-width="0.8"/>
  <defs>
    <filter id="bookshadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="3" dy="7" stdDeviation="8" flood-color="#31331f" flood-opacity="0.32"/>
    </filter>
  </defs>

  <g font-family="Georgia, 'Times New Roman', Batang, 'Nanum Myeongjo', serif">

    <!-- ============ NAME ============ -->
    <text x="400" y="112" text-anchor="middle" font-size="44" fill="#31331f">경<tspan font-family="'Century Gothic', Futura, 'Segoe UI', Arial, sans-serif" letter-spacing="-4">01</tspan> Min</text>
    <text x="400" y="150" text-anchor="middle" font-size="15" font-style="italic" fill="#4b4e3a">My English name is Sophia Min.</text>

    <line x1="70" y1="180" x2="730" y2="180" stroke="#645d3b" stroke-width="1.4"/>
    <line x1="70" y1="184" x2="730" y2="184" stroke="#b9ad94" stroke-width="0.7"/>

    <!-- ============ I. MY GOAL OR OBJECTIVE ============ -->
    <rect x="260" y="212" width="280" height="30" rx="2" fill="#645d3b"/>
    <text x="400" y="232" text-anchor="middle" font-size="12.5" letter-spacing="3" fill="#EFEAE0">&#8544;&#160;&#160;·&#160;&#160;MY GOAL OR OBJECTIVE</text>

    <text x="400" y="278" text-anchor="middle" font-size="15" font-style="italic" fill="#4b4e3a">&#8220;Whenever I was having a hard time, I reminded myself of this and got back on my feet.&#8221;</text>

    <text x="400" y="312" text-anchor="middle" font-size="12" letter-spacing="3" fill="#8a7f63">OPTIMIZING OBJECTIVE FUNCTIONS</text>

    <text x="260" y="368" font-size="30" font-style="italic" fill="#31331f">X<tspan font-size="30" dy="-13">&#8902;</tspan><tspan dy="13" font-style="normal">&#160;=&#160;arg&#160;min</tspan><tspan>&#160;&#160;F</tspan><tspan font-style="normal">&#160;(</tspan><tspan>X&#8242;</tspan><tspan font-style="normal">)&#160;.</tspan></text>
    <text x="385" y="396" text-anchor="middle" font-size="15" font-style="italic" fill="#31331f">X&#8242; &#8712; &#119987;</text>

    <text x="270" y="442" font-size="17" font-weight="bold" fill="#645d3b">minimizing<tspan font-size="11" dy="-7" font-weight="normal" fill="#8a7f63">1</tspan></text>
    <text x="270" y="472" font-size="16" fill="#31331f">an <tspan font-weight="bold" fill="#645d3b">objective function</tspan> <tspan font-style="italic">F(X)</tspan></text>
    <text x="270" y="502" font-size="16" fill="#31331f"><tspan font-weight="bold" fill="#645d3b">configurations</tspan>, <tspan font-style="italic">&#119987;</tspan></text>

    <line x1="300" y1="528" x2="500" y2="528" stroke="#9a9078" stroke-width="0.8"/>
    <text x="400" y="550" text-anchor="middle" font-size="12" fill="#6e6754"><tspan font-size="9" dy="-4">1</tspan><tspan dy="4">&#160;We could also </tspan><tspan font-style="italic">maximize</tspan><tspan> the same objective by replacing </tspan><tspan font-style="italic">F(x)</tspan><tspan> with </tspan><tspan font-style="italic">&#8722;F(x)</tspan><tspan>, and the problem would be unchanged.</tspan></text>

    <line x1="70" y1="584" x2="730" y2="584" stroke="#645d3b" stroke-width="1.4"/>
    <line x1="70" y1="588" x2="730" y2="588" stroke="#b9ad94" stroke-width="0.7"/>

    <!-- ============ II. WORDS ============ -->
    <rect x="280" y="616" width="240" height="30" rx="2" fill="#645d3b"/>
    <text x="400" y="636" text-anchor="middle" font-size="12.5" letter-spacing="3" fill="#EFEAE0">&#8545;&#160;&#160;·&#160;&#160;I LIKE THE WORDS</text>

    <text x="400" y="684" text-anchor="middle" font-size="16" font-weight="bold" letter-spacing="1" fill="#31331f">&#8220;Behavio(u)r / Action&#8221;</text>
    <text x="400" y="710" text-anchor="middle" font-size="14" font-style="italic" fill="#4b4e3a">Behavior of living organisms (humans, animals&#8230;)&#160;&#160;<tspan font-style="normal" font-weight="bold" fill="#645d3b">VS.</tspan>&#160;&#160;Behavior of non-living things (AI, robots&#8230;)</text>

    <text x="400" y="754" text-anchor="middle" font-size="16" font-weight="bold" letter-spacing="1" fill="#31331f">&#8220;Adversarial Search&#8221;</text>
    <text x="400" y="780" text-anchor="middle" font-size="14" font-style="italic" fill="#4b4e3a">Ever since I was young, I enjoyed learning about things that held completely opposite information.</text>
    <text x="400" y="804" text-anchor="middle" font-size="12.5" font-style="italic" fill="#8a7f63">ex)&#160;&#160;Min&#160;&#160;<tspan font-style="normal" font-weight="bold" fill="#645d3b">VS.</tspan>&#160;&#160;Max</text>

    <!-- ============ THE BOOK (hardcover) ============ -->
    <g>
    <!-- cover boards -->
    <rect x="52" y="822" width="702" height="526" rx="4" fill="#31331f" filter="url(#bookshadow)"/>
    <!-- spine with gilt bands -->
    <rect x="52" y="822" width="22" height="526" rx="4" fill="#262819"/>
    <line x1="73" y1="828" x2="73" y2="1342" stroke="#4b4e3a" stroke-width="1"/>
    <line x1="56" y1="854" x2="70" y2="854" stroke="#9c8a5a" stroke-width="1.2"/>
    <line x1="56" y1="859" x2="70" y2="859" stroke="#9c8a5a" stroke-width="0.8"/>
    <line x1="56" y1="1312" x2="70" y2="1312" stroke="#9c8a5a" stroke-width="0.8"/>
    <line x1="56" y1="1317" x2="70" y2="1317" stroke="#9c8a5a" stroke-width="1.2"/>
    <!-- page fore-edges: right side -->
    <rect x="730" y="830" width="14" height="510" fill="#e6ddcb"/>
    <line x1="732.5" y1="832" x2="732.5" y2="1338" stroke="#b9ad94" stroke-width="0.7"/>
    <line x1="735" y1="832" x2="735" y2="1338" stroke="#c9bda6" stroke-width="0.7"/>
    <line x1="737.5" y1="832" x2="737.5" y2="1338" stroke="#b9ad94" stroke-width="0.7"/>
    <line x1="740" y1="832" x2="740" y2="1338" stroke="#c9bda6" stroke-width="0.7"/>
    <!-- page fore-edges: bottom -->
    <rect x="76" y="1332" width="668" height="12" fill="#e6ddcb"/>
    <line x1="78" y1="1334.5" x2="742" y2="1334.5" stroke="#b9ad94" stroke-width="0.7"/>
    <line x1="78" y1="1337" x2="742" y2="1337" stroke="#c9bda6" stroke-width="0.7"/>
    <line x1="78" y1="1339.5" x2="742" y2="1339.5" stroke="#b9ad94" stroke-width="0.7"/>
    <line x1="78" y1="1342" x2="742" y2="1342" stroke="#c9bda6" stroke-width="0.7"/>
    <!-- top page with gutter shading -->
    <rect x="70" y="836" width="660" height="496" fill="#d8cdbc" stroke="#8a7f63" stroke-width="0.9"/>
    <rect x="70" y="836" width="9" height="496" fill="#c9bda9" opacity="0.6"/>
    <rect x="84" y="848" width="632" height="476" fill="none" stroke="#c6ba9f" stroke-width="0.7"/>

    <text x="400" y="886" text-anchor="middle" font-size="22" letter-spacing="4" fill="#31331f">ARTIFICIAL INTELLIGENCE</text>
    <text x="400" y="912" text-anchor="middle" font-size="15" font-style="italic" fill="#645d3b">A Modern Approach</text>
    <text x="400" y="936" text-anchor="middle" font-size="14" fill="#4b4e3a">Stuart Russell&#160;&#160;·&#160;&#160;Peter Norvig</text>
    <text x="400" y="956" text-anchor="middle" font-size="11" letter-spacing="3" fill="#645d3b">THIRD EDITION</text>

    <line x1="310" y1="972" x2="382" y2="972" stroke="#a89c82" stroke-width="1"/>
    <text x="400" y="976" text-anchor="middle" font-size="9" fill="#645d3b">&#9670;</text>
    <line x1="418" y1="972" x2="490" y2="972" stroke="#a89c82" stroke-width="1"/>

    <text x="400" y="1000" text-anchor="middle" font-size="12" letter-spacing="6" fill="#6e6754">CONTENTS</text>

    <!-- Part I -->
    <text x="110" y="1032" font-size="13" letter-spacing="2" fill="#4b4e3a" font-weight="bold">PART&#160;&#160;&#8544;&#160;&#160;·&#160;&#160;ARTIFICIAL INTELLIGENCE</text>

    <text x="110" y="1059" font-size="14.5" fill="#9a9078">1&#160;&#160;&#160;Introduction</text>
    <line x1="240" y1="1054" x2="655" y2="1054" stroke="#b9ad94" stroke-width="1.3" stroke-dasharray="1 6" stroke-linecap="round"/>
    <text x="690" y="1059" text-anchor="end" font-size="14.5" fill="#9a9078">1</text>

    <text x="110" y="1086" font-size="14.5" fill="#31331f">2&#160;&#160;&#160;Intelligent Agents</text>
    <line x1="285" y1="1081" x2="655" y2="1081" stroke="#b9ad94" stroke-width="1.3" stroke-dasharray="1 6" stroke-linecap="round"/>
    <text x="690" y="1086" text-anchor="end" font-size="14.5" fill="#31331f">34</text>

    <!-- highlighted: 2.2 Good Behavior (Moss band, Sand text) -->
    <rect x="95" y="1096" width="610" height="26" rx="3" fill="#31331f"/>
    <text x="82" y="1115" font-size="14" fill="#645d3b">&#10087;</text>
    <text x="128" y="1114" font-size="14.5" font-weight="bold" fill="#E8E2DA">2.2&#160;&#160;Good Behavior: <tspan font-style="italic">The Concept of Rationality</tspan></text>
    <line x1="490" y1="1109" x2="650" y2="1109" stroke="#6b6d55" stroke-width="1.3" stroke-dasharray="1 6" stroke-linecap="round"/>
    <text x="690" y="1114" text-anchor="end" font-size="14.5" font-weight="bold" fill="#E8E2DA">36</text>

    <!-- Part II -->
    <text x="110" y="1156" font-size="13" letter-spacing="2" fill="#4b4e3a" font-weight="bold">PART&#160;&#160;&#8545;&#160;&#160;·&#160;&#160;PROBLEM-SOLVING</text>

    <text x="110" y="1183" font-size="14.5" fill="#9a9078">3&#160;&#160;&#160;Solving Problems by Searching</text>
    <line x1="350" y1="1178" x2="655" y2="1178" stroke="#b9ad94" stroke-width="1.3" stroke-dasharray="1 6" stroke-linecap="round"/>
    <text x="690" y="1183" text-anchor="end" font-size="14.5" fill="#9a9078">64</text>

    <text x="110" y="1210" font-size="14.5" fill="#9a9078">4&#160;&#160;&#160;Beyond Classical Search</text>
    <line x1="308" y1="1205" x2="655" y2="1205" stroke="#b9ad94" stroke-width="1.3" stroke-dasharray="1 6" stroke-linecap="round"/>
    <text x="690" y="1210" text-anchor="end" font-size="14.5" fill="#9a9078">120</text>

    <!-- highlighted: 5 Adversarial Search -->
    <rect x="95" y="1220" width="610" height="26" rx="3" fill="#31331f"/>
    <text x="82" y="1239" font-size="14" fill="#645d3b">&#10087;</text>
    <text x="110" y="1238" font-size="14.5" font-weight="bold" fill="#E8E2DA">5&#160;&#160;&#160;<tspan font-style="italic">Adversarial Search</tspan></text>
    <line x1="290" y1="1233" x2="650" y2="1233" stroke="#6b6d55" stroke-width="1.3" stroke-dasharray="1 6" stroke-linecap="round"/>
    <text x="690" y="1238" text-anchor="end" font-size="14.5" font-weight="bold" fill="#E8E2DA">161</text>

    <!-- book notes -->
    <text x="400" y="1272" text-anchor="middle" font-size="12" font-style="italic" fill="#6e6754">&#8224; In the Fourth Edition, &#8220;5. Adversarial Search&#8221; was retitled &#8220;6. Adversarial Search and Games.&#8221;</text>
    <text x="400" y="1294" text-anchor="middle" font-size="12" font-style="italic" fill="#645d3b">&#8251; Note &#8212; Actually, I really like the overall content of this book.</text>
    <text x="400" y="1316" text-anchor="middle" font-size="12" font-style="italic" fill="#4b4e3a">In other words, my knowledge starts from the knowledge mentioned earlier.</text>
    </g>

    <!-- ============ III. INTERESTS ============ -->
    <line x1="70" y1="1376" x2="730" y2="1376" stroke="#645d3b" stroke-width="1.4"/>
    <line x1="70" y1="1380" x2="730" y2="1380" stroke="#b9ad94" stroke-width="0.7"/>

    <rect x="210" y="1394" width="380" height="30" rx="2" fill="#645d3b"/>
    <text x="400" y="1414" text-anchor="middle" font-size="12.5" letter-spacing="3" fill="#EFEAE0">&#8546;&#160;&#160;·&#160;&#160;I LIKE ANYTHING THAT UTILIZES AI</text>

    <text x="400" y="1450" text-anchor="middle" font-size="18" font-style="italic" fill="#4b4e3a">Research, AI &amp; Full-Stack Developer</text>

    <text x="400" y="1480" text-anchor="middle" font-size="13.5" fill="#31331f">LLM&#160;&#160;<tspan fill="#645d3b">·</tspan>&#160;&#160;NLP&#160;&#160;<tspan fill="#645d3b">·</tspan>&#160;&#160;RAG&#160;&#160;<tspan fill="#645d3b">·</tspan>&#160;&#160;Health Care&#160;&#160;<tspan fill="#645d3b">·</tspan>&#160;&#160;Physical AI&#160;&#160;<tspan fill="#645d3b">·</tspan>&#160;&#160;Search &amp; Optimization</text>
    <text x="400" y="1504" text-anchor="middle" font-size="13.5" fill="#31331f">Evolutionary Computation&#160;&#160;<tspan fill="#645d3b">·</tspan>&#160;&#160;Quantum Computer&#160;&#160;<tspan fill="#645d3b">·</tspan>&#160;&#160;Digital Twin&#160;&#160;<tspan fill="#645d3b">·</tspan>&#160;&#160;&#8943;</text>

    <line x1="300" y1="1526" x2="382" y2="1526" stroke="#b9ad94" stroke-width="1"/>
    <text x="400" y="1530.5" text-anchor="middle" font-size="10" fill="#645d3b">&#9670;</text>
    <line x1="418" y1="1526" x2="500" y2="1526" stroke="#b9ad94" stroke-width="1"/>

    <!-- closing -->
    <text x="400" y="1568" text-anchor="middle" font-size="17" font-style="italic" fill="#4b4e3a">I see the real world in 0 and 1.</text>
    <text x="400" y="1602" text-anchor="middle" font-size="17" font-style="italic" fill="#4b4e3a">That is why I am <tspan font-style="normal" font-weight="bold" fill="#31331f">경<tspan font-family="'Century Gothic', Futura, 'Segoe UI', Arial, sans-serif" letter-spacing="-1.5">01</tspan> Min</tspan>.</text>

  </g>
</svg>
