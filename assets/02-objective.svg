<svg xmlns="http://www.w3.org/2000/svg" width="780" height="456" viewBox="0 0 780 456">
  <rect x="1" y="1" width="778" height="454" fill="#EBE5DC" stroke="#645d3b" stroke-width="1.5"/>
  <rect x="12" y="12" width="756" height="432" fill="none" stroke="#c9bca4" stroke-width="0.8"/>
  <g font-family="Georgia, 'Times New Roman', Batang, 'Nanum Myeongjo', serif">
    <!-- section heading -->
    <text x="390" y="62" text-anchor="middle" font-size="17" letter-spacing="4" fill="#455763">&#8544;&#160;&#160;·&#160;&#160;MY GOAL OR OBJECTIVE</text>
    <!-- quote -->
    <text x="390" y="100" text-anchor="middle" font-size="15" font-style="italic" fill="#645d3b">&#8220;Whenever I was having a hard time, I reminded myself of this and got back on my feet.&#8221;</text>

    <line x1="330" y1="124" x2="374" y2="124" stroke="#b3a88f" stroke-width="1"/>
    <text x="390" y="128" text-anchor="middle" font-size="9" fill="#645d3b">&#9670;</text>
    <line x1="406" y1="124" x2="450" y2="124" stroke="#b3a88f" stroke-width="1"/>

    <text x="390" y="156" text-anchor="middle" font-size="13" letter-spacing="3" fill="#7a7258">OPTIMIZING OBJECTIVE FUNCTIONS</text>

    <!-- formula -->
    <text x="250" y="218" font-size="30" font-style="italic" fill="#31331f">X<tspan font-size="18" dy="-13">&#8902;</tspan><tspan dy="13" font-style="normal">&#160;=&#160;arg&#160;min</tspan><tspan>&#160;&#160;F</tspan><tspan font-style="normal">&#160;(</tspan><tspan>X&#8242;</tspan><tspan font-style="normal">)&#160;.</tspan></text>
    <text x="375" y="246" text-anchor="middle" font-size="15" font-style="italic" fill="#31331f">X&#8242; &#8712; &#119987;</text>

    <!-- keywords -->
    <text x="260" y="302" font-size="17" font-weight="bold" fill="#455763">minimizing<tspan font-size="11" dy="-7" font-weight="normal" fill="#7a7258">1</tspan></text>
    <text x="260" y="334" font-size="16" fill="#31331f">an <tspan font-weight="bold" fill="#455763">objective function</tspan> <tspan font-style="italic">F(X)</tspan></text>
    <text x="260" y="366" font-size="16" fill="#31331f"><tspan font-weight="bold" fill="#455763">configurations</tspan>, <tspan font-style="italic">&#119987;</tspan></text>

    <!-- footnote -->
    <line x1="290" y1="396" x2="490" y2="396" stroke="#9a8f76" stroke-width="0.8"/>
    <text x="390" y="420" text-anchor="middle" font-size="12" fill="#6e6754"><tspan font-size="9" dy="-4">1</tspan><tspan dy="4">&#160;We could also </tspan><tspan font-style="italic">maximize</tspan><tspan> the same objective by replacing </tspan><tspan font-style="italic">F(x)</tspan><tspan> with </tspan><tspan font-style="italic">&#8722;F(x)</tspan><tspan>, and the problem would be unchanged.</tspan></text>
  </g>
</svg>
